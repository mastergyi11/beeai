<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BeeChat AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    /* Variables for Theme */
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --header-bg: #ffffff;
      --header-border: #e5e5e5;
      --chat-bg: #ffffff; /* Default chat area background */
      --ai-bubble-bg: #f4f4f4;
      --ai-bubble-text: #1a1a1a;
      --input-bg: #f9f9f9;
      --input-border: #e0e0e0;
      --font-size-base: 15px;
    }

    /* Dark Mode Variables */
    body.dark-mode {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --header-bg: #1e1e1e;
      --header-border: #333333;
      --chat-bg: #121212;
      --ai-bubble-bg: #2a2a2a;
      --ai-bubble-text: #e0e0e0;
      --input-bg: #1e1e1e;
      --input-border: #444444;
    }

    html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-color); position: fixed; overscroll-behavior: none; touch-action: none; color: var(--text-color); }
    body { display: flex; flex-direction: column; }

    /* ==================== LOGIN PAGE ==================== */
    #auth-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; padding: 20px; background: var(--bg-color); overflow-y: auto; touch-action: pan-y; }
    #auth-container .auth-box { width: 100%; max-width: 400px; }
    #auth-container h1 { text-align: center; font-size: 28px; color: var(--text-color); margin-bottom: 30px; }
    .welcome-features { margin-bottom: 30px; }
    .feature-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; font-size: 15px; color: var(--text-color); opacity: 0.8; line-height: 1.5; }
    .feature-item .icon { width: 24px; height: 24px; flex-shrink: 0; color: #10a37f; margin-top: 2px; }
    .feature-item .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #auth-container input { width: 100%; padding: 14px 16px; margin-bottom: 12px; border: 1px solid var(--input-border); border-radius: 10px; font-size: 15px; outline: none; background: var(--input-bg); color: var(--text-color); transition: all 0.2s; }
    #auth-container input:focus { border-color: #10a37f; }
    #auth-container button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
    .btn-primary { background: #10a37f; color: white; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    body.dark-mode .btn-secondary { background: #333; color: #fff; }
    .btn-google { background: var(--bg-color); color: var(--text-color); border: 1px solid var(--input-border) !important; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-skip { background: transparent; color: #888; font-size: 14px !important; font-weight: 400 !important; margin-top: 5px; }
    .divider { display: flex; align-items: center; margin: 15px 0; color: #ccc; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--input-border); }
    .divider span { padding: 0 10px; color: #999; }

    /* ==================== CHAT PAGE ==================== */
    #app-container { display: none; flex-direction: column; height: 100vh; width: 100%; background: var(--bg-color); }
    #app-container.active { display: flex; }
    .app-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--header-border); background: var(--header-bg); flex-shrink: 0; z-index: 20; transition: background 0.3s; }
    .app-header .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; color: var(--text-color); }
    
    .chat-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 16px 160px 16px; background: var(--chat-bg); touch-action: pan-y; overscroll-behavior-y: contain; transition: background 0.3s; }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    
    .msg { display: flex; margin-bottom: 20px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { justify-content: flex-end; }
    .msg.ai { justify-content: flex-start; }
    .msg .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: var(--font-size-base); line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: all 0.2s; }
    .msg.user .bubble { background: #10a37f; color: #ffffff; border-bottom-right-radius: 4px; }
    .msg.ai .bubble { background: var(--ai-bubble-bg); color: var(--ai-bubble-text); border-bottom-left-radius: 4px; padding: 8px; }
    
    .msg.user .bubble img { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; max-height: 250px; object-fit: contain; }

    /* ==================== AI IMAGE UI CSS ==================== */
    .ai-image-container { position: relative; display: block; width: 100%; border-radius: 12px; overflow: hidden; cursor: pointer; background: #eaeaea; }
    .ai-image-container img { display: block; width: 100%; max-height: 70vh; object-fit: contain; margin: 0 !important; border-radius: 12px; }
    .ai-image-menu-btn { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; background: rgba(0, 0, 0, 0.5); color: #fff; border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 10; }
    .ai-image-menu-btn:active { background: rgba(0, 0, 0, 0.7); }

    #fullscreen-image-viewer { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 9999; display: none; align-items: center; justify-content: center; }
    #fullscreen-image-viewer.active { display: flex; }
    #fullscreen-image-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; touch-action: pinch-zoom; }

    .image-error { color: #c62828; font-size: 14px; line-height: 1.5; padding: 10px; }
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: blink 1.4s infinite both; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

    .input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 20px 16px; background: var(--bg-color); border-top: 1px solid var(--header-border); z-index: 10; transition: background 0.3s; }
    .input-row { display: flex; align-items: flex-end; gap: 10px; max-width: 800px; margin: 0 auto; }
    .input-row textarea { flex: 1; padding: 12px 16px; border: 1px solid var(--input-border); border-radius: 24px; font-size: 15px; resize: none; outline: none; max-height: 120px; min-height: 48px; line-height: 1.4; background: var(--input-bg); color: var(--text-color); transition: all 0.2s; }
    .input-row textarea:focus { border-color: #10a37f; }
    .send-btn { width: 48px; height: 48px; border-radius: 50%; background: #10a37f; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; transition: background 0.2s; }
    .send-btn:disabled { background: #ccc; cursor: not-allowed; }

    .error-text { color: #dc3545; text-align: center; font-size: 14px; margin-bottom: 10px; }
    .success-text { color: #28a745; text-align: center; font-size: 14px; margin-bottom: 10px; }
    .hidden { display: none !important; }

    .header-actions { display:flex; align-items:center; gap:8px; position:relative; }
    .icon-btn { width:40px; height:40px; border:1px solid var(--input-border); border-radius:50%; background:var(--header-bg); color:var(--text-color); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition: all 0.2s; }
    .icon-btn:active, .menu-item:active, .attach-option:active { background:var(--input-bg); }
    
    .popup-menu { position:absolute; right:0; top:48px; width:min(280px, calc(100vw - 32px)); background:var(--header-bg); border:1px solid var(--header-border); border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.2); padding:7px; z-index:50; max-height: 80vh; overflow-y: auto; }
    .menu-item { display:flex; align-items:center; gap:12px; width:100%; padding:12px; border:0; border-radius:10px; background:transparent; color:var(--text-color); text-align:left; font-size:14px; cursor:pointer; }
    .menu-item .mi-icon { width:24px; text-align:center; font-size:18px; }
    .menu-separator { height:1px; background:var(--header-border); margin:5px 4px; }
    
    .attach-btn { width:48px; height:48px; border-radius:50%; border:1px solid var(--input-border); background:var(--bg-color); color:var(--text-color); font-size:25px; flex-shrink:0; cursor:pointer; display: flex; align-items: center; justify-content: center; }
    .attach-wrap { position:relative; flex-shrink:0; }
    .attach-menu { position:absolute; left:0; bottom:56px; width:220px; background:var(--header-bg); border:1px solid var(--header-border); border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.2); padding:7px; z-index:40; }
    .attach-option { display:flex; align-items:center; gap:10px; width:100%; padding:12px; border:0; border-radius:10px; background:transparent; text-align:left; color:var(--text-color); font-size:14px; cursor:pointer; }
    
    .attachment-preview { display:none; max-width:800px; margin:0 auto 8px; padding:8px 12px; border:1px solid var(--header-border); border-radius:14px; background:var(--input-bg); align-items:center; gap:10px; }
    .attachment-preview img { width:54px; height:54px; object-fit:cover; border-radius:8px; }
    .attachment-info { min-width:0; flex:1; font-size:13px; color:var(--text-color); opacity: 0.8; overflow-wrap:anywhere; }
    .remove-attachment { border:0; background:transparent; font-size:22px; padding:5px 9px; cursor:pointer; color:var(--text-color); opacity: 0.6; }
    
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:18px; }
    .app-modal { width:100%; max-width:480px; max-height:80vh; overflow:auto; background:var(--header-bg); color: var(--text-color); border-radius:18px; padding:18px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
    .modal-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .modal-head h3 { font-size:18px; }
    .modal-close { border:0; background:var(--input-bg); color: var(--text-color); border-radius:50%; width:34px; height:34px; font-size:20px; cursor:pointer; }
    
    .history-search { width:100%; padding:11px 12px; border:1px solid var(--input-border); border-radius:10px; margin-bottom:12px; font-size:14px; background: var(--input-bg); color: var(--text-color); }
    .history-item { padding:12px; border:1px solid var(--header-border); border-radius:10px; margin-bottom:8px; cursor:pointer; font-size:14px; overflow-wrap:anywhere; }
    .modal-note { color:var(--text-color); opacity: 0.7; font-size:13px; line-height:1.5; margin:8px 0 14px; }
    
    .chat-area { padding-bottom:190px; }

    /* ⭐️ Settings Custom Styles */
    .settings-section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--header-border); }
    .settings-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    
    /* Dark mode toggle switch */
    .toggle-switch { position: relative; display: inline-block; width: 50px; height: 26px; margin-left: auto; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #10a37f; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* Color Picker Dots */
    .color-options { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .color-dot { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .color-dot:active { transform: scale(0.9); }
    .color-dot.selected { border-color: #10a37f; transform: scale(1.1); }
    
    /* Font Size Slider */
    .font-slider-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .font-slider-container span { font-size: 14px; }
    .font-slider { flex: 1; -webkit-appearance: none; height: 6px; background: var(--input-border); border-radius: 5px; outline: none; }
    .font-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #10a37f; cursor: pointer; }

    @media (max-width:480px) {
      .app-header { padding:9px 12px; }
      .app-header .logo { font-size:16px; }
      .input-area { padding:10px 10px calc(12px + env(safe-area-inset-bottom)); }
      .input-row { gap:7px; }
      .attach-btn, .send-btn { width:44px; height:44px; }
      .input-row textarea { min-height:44px; padding:11px 13px; }
    }
  </style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-box">
      <h1>🐝 BeeChat AI</h1>
      <div class="welcome-features">
        <div class="feature-item">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></span>
          <span>သင့်စိတ်ကူးတွေကို အသက်သွင်းပြီး အလုပ်တွေ ပြီးမြောက်အောင် လုပ်ဆောင်ပါ</span>
        </div>
        <div class="feature-item">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
          <span>BeeChat AI က အမှားတွေ လုပ်နိုင်ပါတယ်၊ အရေးကြီးတာတွေကို စစ်ဆေးပါ</span>
        </div>
      </div>
      <div id="auth-message"></div>
      <button class="btn-google" onclick="signInWithGoogle()">
        <img src="https://www.google.com/favicon.ico" alt="Google" />
        Continue with Google
      </button>
      <div class="divider"><span>OR</span></div>
      <input type="email" id="email" placeholder="📧 Email" />
      <input type="password" id="password" placeholder="🔒 Password" />
      <button class="btn-primary" onclick="signUp()">📝 Register</button>
      <button class="btn-secondary" onclick="signIn()">🔑 Login</button>
      <button class="btn-skip" onclick="skipLogin()">Skip</button>
    </div>
  </div>

  <div id="app-container">
    <div class="app-header">
      <div class="logo">🐝 BeeChat AI</div>
      <div class="header-actions">
        <button class="icon-btn" type="button" onclick="newChat()" title="New chat">＋</button>
        <button class="icon-btn" type="button" onclick="toggleTopMenu()" title="Menu">☰</button>
        
        <!-- ⭐️ Updated Menu with Dark Mode & Settings -->
        <div id="top-menu" class="popup-menu hidden">
          <button class="menu-item" onclick="newChat(); closeTopMenu()"><span class="mi-icon">✏️</span><span>စကားဝိုင်းအသစ် (New chat)</span></button>
          
          <!-- Dark Mode Toggle -->
          <div class="menu-item" style="justify-content: space-between; cursor: default;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <span class="mi-icon">💡</span><span>အမှောင်စနစ် (Dark Mode)</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode(this.checked)">
              <span class="slider"></span>
            </label>
          </div>
          
          <button class="menu-item" onclick="openHistory(); closeTopMenu()"><span class="mi-icon">🕘</span><span>Chat History</span></button>
          <button class="menu-item" onclick="openSettings(); closeTopMenu()"><span class="mi-icon">⚙️</span><span>ဆက်တင်များ (Settings)</span></button>
          
          <div class="menu-separator"></div>
          <button class="menu-item" onclick="clearAllChat(); closeTopMenu()"><span class="mi-icon">🗑️</span><span>Chat အားလုံးဖျက်ရန်</span></button>
          <button class="menu-item" onclick="signOut(); closeTopMenu()"><span class="mi-icon">🚪</span><span>Logout</span></button>
        </div>
      </div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="msg ai">
        <div class="bubble">မင်္ဂလာပါ! ကျွန်တော်က BeeChat AI ပါ။ ဘာများ ကူညီပေးရမလဲ?</div>
      </div>
    </div>

    <div class="input-area">
      <div id="attachment-preview" class="attachment-preview">
        <img id="attachment-thumb" alt="Selected attachment" style="display:none;">
        <div id="attachment-info" class="attachment-info"></div>
        <button type="button" class="remove-attachment" onclick="clearAttachment()">×</button>
      </div>
      <div class="input-row">
        <div class="attach-wrap">
          <button class="attach-btn" type="button" onclick="toggleAttachMenu()">＋</button>
          <div id="attach-menu" class="attach-menu hidden">
            <button class="attach-option" onclick="openCamera()"><span>📷</span> Camera</button>
            <button class="attach-option" onclick="openGallery()"><span>🖼️</span> Gallery</button>
            <button class="attach-option" onclick="openFiles()"><span>📁</span> Files</button>
          </div>
        </div>
        <textarea id="prompt" rows="1" placeholder="မက်ဆေ့ချ် ရိုက်ထည့်ပါ..."></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
      <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
      <input id="gallery-input" type="file" accept="image/*" hidden>
      <input id="files-input" type="file" accept="image/*,.pdf,.txt,.html,.css,.js,.json,.md,.doc,.docx,.xls,.xlsx,.csv,.zip" hidden>
    </div>
    <div id="modal-root"></div>
  </div>

  <div id="fullscreen-image-viewer" onclick="closeFullscreenImage()">
    <img id="fullscreen-img" src="" alt="Fullscreen" onclick="event.stopPropagation()">
  </div>

  <script>
    // Disable touch zoom/refresh
    document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1 && !e.target.closest('#fullscreen-image-viewer')) { e.preventDefault(); }
    }, { passive: false });
    let touchStartY = 0;
    document.addEventListener('touchstart', function(e) { if (e.touches.length === 1) { touchStartY = e.touches[0].clientY; } }, { passive: false });
    document.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1) {
            let touchDiffY = e.touches[0].clientY - touchStartY;
            let chatArea = document.getElementById('chat-area');
            if (chatArea && chatArea.scrollTop <= 0 && touchDiffY > 0) { e.preventDefault(); }
        }
    }, { passive: false });

    const SUPABASE_URL = 'https://zrcekvtzncenoeppijig.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_TuA7BebA5lNFg_32yPzfdw_E9OHIqQf';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const GROQ_API_URL = 'https://square-feather-e7a5.klay91680.workers.dev';
    const IMAGE_API_URL = 'https://beechat-image-api.seinmyint786777.workers.dev';

    let selectedAttachment = null;
    let selectedAttachmentDataUrl = null;
    let currentChatStartedAt = Date.now();

    // ==========================================
    // ⭐️ SETTINGS LOGIC (Theme, Background, Font Size)
    // ==========================================
    
    // Initialize settings from localStorage
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Dark Mode
      const isDarkMode = localStorage.getItem('beeDarkMode') === 'true';
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
        document.getElementById('dark-mode-toggle').checked = true;
      }

      // 2. Chat Background Color
      const savedBgColor = localStorage.getItem('beeChatBgColor') || '#ffffff';
      document.documentElement.style.setProperty('--chat-bg', savedBgColor);

      // 3. Font Size
      const savedFontSize = localStorage.getItem('beeFontSize') || '15px';
      document.documentElement.style.setProperty('--font-size-base', savedFontSize);
    });

    function toggleDarkMode(isDark) {
      if (isDark) {
        document.body.classList.add('dark-mode');
        localStorage.setItem('beeDarkMode', 'true');
      } else {
        document.body.classList.remove('dark-mode');
        localStorage.setItem('beeDarkMode', 'false');
      }
    }

    function setChatBgColor(color, element) {
      document.documentElement.style.setProperty('--chat-bg', color);
      localStorage.setItem('beeChatBgColor', color);
      
      // Update UI selected state
      document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('selected'));
      element.classList.add('selected');
    }

    function changeFontSize(size) {
      document.documentElement.style.setProperty('--font-size-base', size + 'px');
      localStorage.setItem('beeFontSize', size + 'px');
      document.getElementById('font-size-val').innerText = size + 'px';
    }

    // ==========================================

    function toggleTopMenu() { document.getElementById('top-menu').classList.toggle('hidden'); document.getElementById('attach-menu').classList.add('hidden'); }
    function closeTopMenu() { document.getElementById('top-menu').classList.add('hidden'); }
    function toggleAttachMenu() { document.getElementById('attach-menu').classList.toggle('hidden'); closeTopMenu(); }
    function closeAttachMenu() { document.getElementById('attach-menu').classList.add('hidden'); }
    function openCamera() { closeAttachMenu(); document.getElementById('camera-input').click(); }

    function handleAttachmentSelection(event) {

      if (!file) return;
      if (file.size > 100 * 1024 * 1024) { alert('100MB ထက် မကျော်ပါစေနဲ့။'); event.target.value = ''; return; }
      selectedAttachment = file;
      const preview = document.getElementById('attachment-preview');

      document.getElementById('attachment-info').textContent = file.name + ' (' + formatFileSize(file.size) + ')';
      if (file.type && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = () => { selectedAttachmentDataUrl = String(reader.result || ''); thumb.src = selectedAttachmentDataUrl; thumb.style.display = 'block'; };

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

      if (/Samsung/i.test(ua)) device = "Samsung"; else if (/Xiaomi|Redmi|POCO/i.test(ua)) device = "Xiaomi"; else if (/Huawei/i.test(ua)) device = "Huawei"; else if (/OPPO/i.test(ua)) device = "OPPO"; else if (/vivo/i.test(ua)) device = "Vivo"; else if (/OnePlus/i.test(ua)) device = "OnePlus"; else if (/iPhone/i.test(ua)) device = "iPhone"; else if (/iPad/i.test(ua)) device = "iPad"; else if (/Realme/i.test(ua)) device = "Realme"; else if (/Infinix/i.test(ua)) device = "Infinix"; else if (/Tecno/i.test(ua)) device = "Tecno";

    async function sendMessage() {
      const promptInput = document.getElementById('prompt');
      const prompt = promptInput.value.trim();
      const attachment = selectedAttachment;
      const attachmentDataUrl = selectedAttachmentDataUrl;
      const chatArea = document.getElementById('chat-area');
      const sendBtn = document.getElementById('send-btn');
      
      if (!prompt && !attachment) return;

      let userBubbleContent = '';
      if (prompt) userBubbleContent += escapeHtml(prompt) + (attachment ? '<br>' : '');
      
      if (attachment) {
        if (attachmentDataUrl && attachment.type && attachment.type.startsWith('image/')) {
          userBubbleContent += `<img src="${attachmentDataUrl}" alt="Attached Image">`;
        } else {
          userBubbleContent += '<span style="font-size:12px;opacity:.9">📎 ' + escapeHtml(attachment.name) + '</span>';
        }
      }

      chatArea.innerHTML += '<div class="msg user"><div class="bubble">' + userBubbleContent + '</div></div>';
      promptInput.value = ''; promptInput.style.height = 'auto'; chatArea.scrollTop = chatArea.scrollHeight;
      
      const typingId = 'typing-' + Date.now();
      chatArea.innerHTML += '<div class="msg ai" id="' + typingId + '"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>';
      chatArea.scrollTop = chatArea.scrollHeight; sendBtn.disabled = true;
      
      try {
        if (!attachment && isImageGenerationRequest(prompt)) {
          const englishPrompt = await buildEnglishImagePrompt(prompt);
          const imageSrc = await requestGeneratedImage(englishPrompt);
          const typingEl = document.getElementById(typingId); if (typingEl) typingEl.remove();
          chatArea.innerHTML += createImageMessage(imageSrc); chatArea.scrollTop = chatArea.scrollHeight;
          await saveChat(prompt, null, imageSrc); return;
        }
        
        let aiResponse;
        if (attachment) {
          if (attachmentDataUrl && attachment.type.startsWith('image/')) {
            aiResponse = await callGroqAI(prompt || 'ဒီပုံကို ကြည့်ပြီး မြန်မာလို ရှင်းပြပေးပါ။', { fileName: attachment.name, mimeType: attachment.type, imageDataUrl: attachmentDataUrl });
          } else if (attachment.type && /^(text\/|application\/json)/i.test(attachment.type)) {
            const fileText = await readTextAttachment(attachment);
            aiResponse = await callGroqAI((prompt ? prompt + '\n\n' : 'ဒီဖိုင်ကို စစ်ဆေးပြီး ရှင်းပြပါ။') + '\n\n--- ဖိုင်အကြောင်းအရာ: ' + attachment.name + ' ---\n' + fileText);
          } else {
            aiResponse = await callGroqAI((prompt ? prompt + '\n\n' : '') + '[ဖိုင်တွဲထားသည်: ' + attachment.name + '။ ဒီဖိုင်အမျိုးအစားကို browser မှာ အလိုအလျောက်ဖတ်မရသေးပါ။]');
          }
          clearAttachment();
        } else {
          aiResponse = await callGroqAI(prompt);
        }
        document.getElementById(typingId).remove();
        chatArea.innerHTML += '<div class="msg ai"><div class="bubble">' + escapeHtml(aiResponse) + '</div></div>';
        chatArea.scrollTop = chatArea.scrollHeight;
        await saveChat(prompt, aiResponse, null);
      } catch (err) {
        document.getElementById(typingId).remove();
        chatArea.innerHTML += '<div class="msg ai"><div class="bubble">❌ Error: ' + escapeHtml(err.message) + '</div></div>';

    async function callGroqAI(prompt, attachment = null) {
      const payload = { prompt }; if (attachment) Object.assign(payload, attachment);
      const response = await fetch(GROQ_API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || ('BeeChat AI request failed (HTTP ' + response.status + ')'));
      if (typeof data.answer !== 'string' || !data.answer) throw new Error('Worker က AI အဖြေမမှန်တဲ့ပုံစံနဲ့ ပြန်ပေးထားပါတယ်။');
      return data.answer;
    }

    function isImageGenerationRequest(text) {
      const t = String(text || '').trim().toLowerCase(); if (!t) return false;
      const imageWords = /ပုံ|ဓာတ်ပုံ|နောက်ခံပုံ|လိုဂို|ပိုစတာ|ကာတွန်း|ခွေး|ကြောင်|မျောက်|ငှက်|မြင်း|ဆင်/;
      const createActions = /ဖန်တီး|ဆွဲ|လုပ်ပေး|ထုတ်ပေး|ဖော်ပြ|ဖော်ပေး|လုပ်ပေးပါ|ဖန်တီးပေး/;
      const englishImage = /\b(image|picture|photo|illustration|wallpaper|logo|poster|avatar|artwork|drawing)\b/i;
      const englishAction = /\b(generate|create|draw|make|design|render|illustrate)\b/i;
      if (imageWords.test(t) && createActions.test(t)) return true;
      if (englishImage.test(t) && englishAction.test(t)) return true;
      if (/\b(dog|cat|monkey|bird|horse|elephant|rabbit|lion|tiger)\b/i.test(t) && /\b(image|picture|photo|draw|create|generate)\b/i.test(t)) return true;
      return false;
    }
    async function buildEnglishImagePrompt(userPrompt) {
      const text = String(userPrompt || '').trim();
      const animals = [{ words: ['မျောက်', 'monkey'], name: 'monkey' }, { words: ['ခွေး', 'dog'], name: 'dog' }, { words: ['ကြောင်', 'cat'], name: 'cat' }, { words: ['ငှက်', 'bird'], name: 'bird' }, { words: ['မြင်း', 'horse'], name: 'horse' }, { words: ['ဆင်', 'elephant'], name: 'elephant' }, { words: ['ယုန်', 'rabbit'], name: 'rabbit' }, { words: ['ခြင်္သေ့', 'lion'], name: 'lion' }, { words: ['ကျား', 'tiger'], name: 'tiger' }];
      const animal = animals.find(item => item.words.some(word => text.toLowerCase().includes(word.toLowerCase())));
      if (animal) return `Create an image of a ${animal.name}. The main subject MUST be a ${animal.name}. Do not show a cat, or any other animal instead. User's original request: ${text}`;
      const instruction = 'Translate this image request into English for an image generator. Preserve the exact subject, objects, colors, setting, and style. Return only the English image prompt.\nUser request: ' + text;
      try {
        const translated = (await callGroqAI(instruction)).trim();
        if (translated && translated.length > 5) return translated.slice(0, 1800);
      } catch (e) {}
      return text;
    }
    async function requestGeneratedImage(prompt) {
      const response = await fetch(IMAGE_API_URL + '?prompt=' + encodeURIComponent(prompt), { method: 'GET', headers: { 'Accept': 'application/json' } });
      const responseText = await response.text(); let data;
      try { data = JSON.parse(responseText); } catch (parseErr) { throw new Error('Image API က JSON ပြန်မပေးပါ။'); }
      if (!response.ok) throw new Error(data.error || data.message || ('Image API HTTP ' + response.status));
      if (data.error) throw new Error(data.error);
      const imageValue = data.image || data.image_url || data.url || data.b64_json || data.base64 || data.data;
      const imageSrc = normalizeImageSource(imageValue);
      if (!imageSrc) throw new Error('Image API က ပုံဒေတာ မပြန်ပေးပါ။');
      return imageSrc;
    }
    function readTextAttachment(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || '').slice(0, 60000));
        reader.onerror = () => reject(new Error('ဖိုင်ကို ဖတ်မရပါ။'));
        reader.readAsText(file);
      });
    }

    function normalizeImageSource(imageValue) {
      if (!imageValue) return null;
      if (typeof imageValue === 'object') { imageValue = imageValue.url || imageValue.image || imageValue.image_url || imageValue.b64_json || imageValue.base64 || imageValue.data || null; }
      if (typeof imageValue !== 'string') return null;
      let value = imageValue.trim(); if (!value) return null;
      if (/^(https?:\/\/|data:image\/)/i.test(value)) return value;
      if (/^[A-Za-z0-9+/=\s]+$/.test(value) && value.length > 100) { value = value.replace(/\s/g, ''); return 'data:image/png;base64,' + value; }
      return value;
    }

    function createImageMessage(imageValue) {
      const src = normalizeImageSource(imageValue);
      if (!src) return '<div class="msg ai"><div class="bubble image-error">❌ API က ပုံဒေတာမမှန်တဲ့ပုံစံနဲ့ ပြန်ပေးထားပါတယ်။</div></div>';
      const safeSrc = escapeHtml(src);
      const imgId = 'img-' + Date.now() + Math.floor(Math.random() * 1000);
      return '<div class="msg ai"><div class="bubble">' +
        '<div class="ai-image-container" onclick="openFullscreenImageById(\'' + imgId + '\')">' +
          '<img id="' + imgId + '" src="' + safeSrc + '" alt="AI Image" loading="lazy" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div class=image-error>❌ ပုံကိုဖွင့်မရပါ။</div>\';">' +
          '<button class="ai-image-menu-btn" onclick="event.stopPropagation(); openImageMenuById(\'' + imgId + '\')">⋮</button>' +
        '</div>' +
      '</div></div>';
    }

    async function autoSaveImageById(imgId) {
      const imgElement = document.getElementById(imgId);
      if (!imgElement) return;
      const imageSrc = imgElement.src;
      try {
        if (imageSrc.startsWith('data:')) {
          const a = document.createElement('a'); a.href = imageSrc; a.download = 'beechat-ai-' + Date.now() + '.png';
          document.body.appendChild(a); a.click(); a.remove(); return;
        }
        const response = await fetch(imageSrc, { mode: 'cors' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const blob = await response.blob(); const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = blobUrl; a.download = 'beechat-ai-' + Date.now() + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
      } catch (err) {
        try {
          const a = document.createElement('a'); a.href = imageSrc; a.target = '_blank'; a.rel = 'noopener'; a.download = 'beechat-ai-' + Date.now() + '.png';
          document.body.appendChild(a); a.click(); a.remove();
        } catch (fallbackErr) { alert('ပုံသိမ်းဆည်းမရပါ: ' + err.message); }
      }
    }

    function openFullscreenImageById(imgId) {
      const imgElement = document.getElementById(imgId);
      if (!imgElement) return;
      const viewer = document.getElementById('fullscreen-image-viewer');
      const fullImg = document.getElementById('fullscreen-img');
      fullImg.src = imgElement.src;
      viewer.classList.add('active');
    }
    function closeFullscreenImage() {
      const viewer = document.getElementById('fullscreen-image-viewer');
      const img = document.getElementById('fullscreen-img');
      viewer.classList.remove('active');
      setTimeout(() => { img.src = ''; }, 300);
    }

    async function saveChat(prompt, response, imageUrl) {
      let history = JSON.parse(localStorage.getItem('beeChatHistory') || '[]');
      history.push({ prompt: prompt, response: response, image_url: imageUrl, created_at: new Date().toISOString() });
      localStorage.setItem('beeChatHistory', JSON.stringify(history));
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) { await supabaseClient.from('chats').insert({ user_id: user.id, prompt: prompt, response: response, image_url: imageUrl }); }
    }

    function loadLocalChat() {
      const chatArea = document.getElementById('chat-area');
      const history = JSON.parse(localStorage.getItem('beeChatHistory') || '[]');
      if (history.length === 0) return;
      chatArea.innerHTML = '';
      history.forEach(item => {
        if (item.prompt) chatArea.innerHTML += '<div class="msg user"><div class="bubble">' + escapeHtml(item.prompt) + '</div></div>';
        if (item.response) chatArea.innerHTML += '<div class="msg ai"><div class="bubble">' + escapeHtml(item.response) + '</div></div>';
        if (item.image_url) chatArea.innerHTML += createImageMessage(item.image_url);
      });
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function loadHistory() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;
      await supabaseClient.from('chats').select('*').eq('user_id', user.id).order('created_at', { ascending: true }).limit(50);
    }

    async function clearAllChat() {
      if (!confirm("Chat စာတွေအကုန် ဖျက်မှာ သေချာလား?")) return;
      localStorage.removeItem('beeChatHistory');
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) { await supabaseClient.from('chats').delete().eq('user_id', user.id); }
      const chatArea = document.getElementById('chat-area');
      chatArea.innerHTML = '<div class="msg ai"><div class="bubble">မင်္ဂလာပါ! ကျွန်တော်က BeeChat AI ပါ။ ဘာများ ကူညီပေးရမလဲ?</div></div>';
      chatArea.scrollTop = 0; 
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    ['camera-input', 'gallery-input', 'files-input'].forEach(id => {
      document.getElementById(id).addEventListener('change', handleAttachmentSelection);
    });

    document.getElementById('prompt').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    document.getElementById('prompt').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    window.addEventListener('load', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) { showApp(session.user); }
    });
  </script>
</body>
  </html>
